AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ceseelia backend

######################################
# Parameters #
######################################
Parameters:
  ApiVersion:
    Type: String
    Default: v1
    Description: Enter API version

  StageName:
    Type: String
    Default: dev
    Description: Enter dev, staging, or prod

  NodeJsRuntime:
    Type: String
    # nodejs18.x is past end of support (Lambda blocks updates to it). Not 24.x: OnUserRegister's
    # handler takes a callback, which nodejs24.x no longer supports.
    Default: nodejs22.x
    Description: Enter like nodejs22.x

  DomainName:
    Type: String
    Default: ceseelia.com
    Description: Base domain of the platform (must be a verified SES domain identity in this account/region)

  # 9.6: where alarms are emailed. Empty = no email subscription (subscribe to the topic in the
  # console instead). AWS emails a confirmation link first; alarms only arrive once it's clicked.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Email address for CloudWatch alarm notifications (optional)

  # L.9: the webapp's CloudFront distribution. The zone and the certificate were made by hand
  # (the certificate is the *.ceseelia.com one the storage distributions already use).
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z09076833MOZ6XA7WWHFO
    Description: Route53 hosted zone of DomainName

  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:258084617016:certificate/391002d6-3ebb-42d2-bf9c-6af98272c0b5
    Description: ACM certificate in us-east-1 covering the webapp domain (*.ceseelia.com)

######################################
# Global configurations #
######################################
Globals:
  Function:
    Runtime: !Sub ${NodeJsRuntime}
    MemorySize: 128 # MB
    Timeout: 30 # Seconds
    Layers:
      - !Ref NodeModulesLayer
      - !Ref CustomLibrariesLayer
    Environment:
      Variables:
        # General
        STAGE: !Sub ${StageName}
        REGION: !Sub ${AWS::Region}
        TABLE_NAME: !Sub ceseelia_${StageName}
        S3_STORAGE_BUCKET: !Sub ceseelia-storage-${StageName}
        SECRET_STORAGE_BUCKET: secrets.primefaya.com
        PUBLIC_STORAGE_BUCKET: public.primefaya.com

######################################
# Conditions #
######################################
Conditions: 
  IsProductionEnvironment: !Equals [ !Ref StageName, prod ]
  HasAlarmEmail: !Not [ !Equals [ !Ref AlarmEmail, "" ] ]

######################################
# Resources #
######################################
Resources:
  ######################################
  # Lambda Functions - Layers
  ######################################
  ### NPM Libraries Layer ###
  NodeModulesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub node-modules-layer-ceseelia-${StageName}-${ApiVersion}
      Description: A layer with npm packages
      ContentUri: ./lambda/layers/npm
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: !Sub ${NodeJsRuntime}

  ### Custom Libraries Layer ###
  CustomLibrariesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub custom-libraries-layer-ceseelia-${StageName}-${ApiVersion}
      Description: A layer with custom libraries
      ContentUri: ./lambda/layers/custom
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: !Sub ${NodeJsRuntime}

  ######################################
  # Cognito 
  ######################################
  ### Cognito ###
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    # 9.6: every account lives here; a lost pool can't be restored. Keep it with the stack's delete.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub ceseelia-${StageName}
      DeletionProtection: ACTIVE
      EmailConfiguration: 
        EmailSendingAccount: DEVELOPER
        From: !Sub support@${DomainName}
        SourceArn: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${DomainName}
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
      UsernameAttributes:
        - email
      Schema:
        - AttributeDataType: String
          Name: userName
          Mutable: true
          Required: false
        - AttributeDataType: String
          Name: email
          Mutable: true
          Required: true
      AutoVerifiedAttributes:
        - email
      EmailVerificationSubject: "Verification - Ceseelia"
      EmailVerificationMessage: "Here's your verification code: <b>{####}</b> <br>Please provide it inside the application."
      
  UserPoolDomain: 
    DependsOn: CognitoUserPool
    Type: AWS::Cognito::UserPoolDomain 
    Properties:
      UserPoolId: !Ref CognitoUserPool 
      Domain: !Sub ceseelia-auth-${StageName}

  CognitoUserPoolClient:
    DependsOn:
      - CognitoUserPool
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: !Sub ${StageName}-ceseelia-pool-client
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
        - implicit
      AllowedOAuthScopes:
        - email
        - openid
        - profile
        - aws.cognito.signin.user.admin
      RefreshTokenValidity: 365
      ReadAttributes:
        - "custom:userName"
        - email
      WriteAttributes:
        - "custom:userName"
        - email
      CallbackURLs:
        - comprimefayaceseeliawebviewcallback://
      LogoutURLs:
        - comprimefayaceseeliawebviewcallback://

  ######################################
  # DynamoDB
  ######################################
  ### DatabaseTable ###
  DatabaseTable:
    Type: AWS::DynamoDB::GlobalTable
    # 9.6: the table holds every store, order and user; never deleted or replaced with the stack.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: 
      TableName: !Sub ceseelia_${StageName}
      BillingMode: "PAY_PER_REQUEST"
      AttributeDefinitions: 
        -
          AttributeName: "pk"
          AttributeType: "S"
        -
          AttributeName: "sk"
          AttributeType: "S"
        # CognitoIdentifierGSI
        -
          AttributeName: "userCognitoId"
          AttributeType: "S"
        # UserEmailGSI
        -
          AttributeName: "userEmail"
          AttributeType: "S"
      KeySchema:
        -
          AttributeName: "pk"
          KeyType: "HASH"
        -
          AttributeName: "sk"
          KeyType: "RANGE"
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      GlobalSecondaryIndexes:
        # CognitoIdentifierGSI
        - IndexName: CognitoIdentifierGSI
          KeySchema:
            - AttributeName: "userCognitoId"
              KeyType: "HASH"
          Projection:
            ProjectionType: ALL
        # UserEmailGSI
        - IndexName: UserEmailGSI
          KeySchema:
            - AttributeName: "userEmail"
              KeyType: "HASH"
          Projection:
            ProjectionType: KEYS_ONLY
      Replicas:
        - Region: !Sub ${AWS::Region}
          # 9.6: restore to any second of the last 35 days; and no accidental delete-table.
          PointInTimeRecoverySpecification:
            PointInTimeRecoveryEnabled: true
          DeletionProtectionEnabled: true

  ######################################
  # S3
  ######################################
  ### Storage Bucket ###
  StorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ceseelia-storage-${StageName}
      AccessControl: Private
      # Already on for both buckets (set by hand); written down so the stack keeps it that way.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # 9.6: a deleted or overwritten image can be brought back for 30 days.
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              # Image uploads are presigned POSTs since backend 2.3 (size and type capped by S3)
              - POST
            AllowedOrigins:
              - '*'
            Id: corsRule1
      LifecycleConfiguration:
        Rules:
          # Backend 2.3d: every upload is tagged ceseelia-upload=pending; saving the store,
          # category or item that uses it removes the tag. Uploads nobody saved go after a day.
          - Id: ExpireUnsavedUploads
            Status: Enabled
            TagFilters:
              - Key: ceseelia-upload
                Value: pending
            ExpirationInDays: 1
          # 9.6: old versions (deleted or replaced images) are kept 30 days, then removed.
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ######################################
  # Webapp hosting (L.9 / 3.2b, WA 3.6)
  ######################################
  # The built Angular app (`dist/.../browser`), private; only the distribution below reads it.
  # Every file can be rebuilt, so no versioning. Retained like the other buckets.
  WebappBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ceseelia-webapp-${StageName}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebappOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ceseelia-webapp-${StageName}
        Description: CloudFront reads the webapp bucket (signed requests)
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebappBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebappBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowWebappDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebappBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !If
                  - IsProductionEnvironment
                  - - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebappDistribution}
                    # 9.8 phase 2: stores' own domains (the multi-tenant distribution below)
                    - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CustomDomainDistribution}
                  - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebappDistribution}

  # Viewer request, for every path:
  #   - a link-preview bot asking for /s/<slug> (optionally ?item=<id>) goes to the API's
  #     /api/v1/store/public/preview/<slug>[/<id>] instead: a tiny page with the store's title,
  #     description and image (bots don't run the app's JavaScript). The new path is also the
  #     cache key, so bots and people never share a cached copy;
  #   - /api/... on the app's own domain is refused (the API has its own domain);
  #   - any other path without a file extension is an app route: /index.html.
  # Store subdomains (prod, backend 9.8 phase 1): every store is also at https://<slug>.<DomainName>
  # (the wildcard alias and records below; the webapp routes `/` there as `/s/<slug>`). A bot
  # asking for `/` [?item=<id>] on one gets that store's preview the same way.
  WebappRouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ceseelia-webapp-router-${StageName}
      AutoPublish: true
      FunctionConfig:
        Comment: SPA routes to index.html; link-preview bots to the API's preview page
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          import cf from 'cloudfront';

          var APP_HOST = '${AppHost}';
          var STORE_SUFFIX = '${StoreSuffix}';
          var SLUG = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
          var BOTS = /facebookexternalhit|facebot|twitterbot|whatsapp|linkedinbot|slackbot|telegrambot|discordbot|pinterest|skypeuripreview|redditbot|applebot|googlebot|bingbot|embedly|mastodon|vkshare|tumblr/i;
          var STORE = /^\/s\/([a-z0-9]+(?:-[a-z0-9]+)*)\/?$/;
          var ULID = /^[0-9A-HJKMNP-TV-Z]{26}$/;

          function handler(event) {
            var req = event.request;
            var uri = req.uri;
            var ua = req.headers['user-agent'] ? req.headers['user-agent'].value : '';
            var m = uri.toLowerCase().match(STORE);
            var slug = m ? m[1] : '';
            // On a store's own address (`<slug>.<domain>`) its storefront is `/`.
            var host = req.headers.host ? req.headers.host.value.toLowerCase() : '';
            if (!slug && STORE_SUFFIX && host !== APP_HOST && (uri === '/' || uri === '') &&
                host.length > STORE_SUFFIX.length && host.slice(-STORE_SUFFIX.length) === STORE_SUFFIX) {
              var sub = host.slice(0, -STORE_SUFFIX.length);
              if (SLUG.test(sub)) slug = sub;
            }
            if (slug && BOTS.test(ua)) {
              var item = req.querystring.item ? req.querystring.item.value : '';
              req.uri = '/api/v1/store/public/preview/' + slug + (ULID.test(item) ? '/' + item : '');
              req.querystring = {};
              cf.selectRequestOriginById('api');
              return req;
            }
            if (uri === '/api' || uri.indexOf('/api/') === 0) {
              return { statusCode: 404, statusDescription: 'Not Found' };
            }
            var last = uri.substring(uri.lastIndexOf('/') + 1);
            if (last.indexOf('.') === -1) {
              req.uri = '/index.html';
            }
            return req;
          }
        - AppHost: !If [ IsProductionEnvironment, !Sub "app.${DomainName}", !Sub "dev.${DomainName}" ]
          # Empty = no store subdomains (dev: the *.ceseelia.com certificate doesn't cover *.dev).
          StoreSuffix: !If [ IsProductionEnvironment, !Sub ".${DomainName}", "" ]

  # Pay as you go. PriceClass_200 (not 100) so shoppers in Asia (the `id` locale) get nearby edges;
  # PriceClass_All adds only South America and Oceania at a higher price.
  # S.14 (backend §0 F1): the webapp's security headers, the managed SecurityHeadersPolicy's set
  # plus a Content-Security-Policy. Scripts only from the site itself (the build has no inline
  # script or handler: the webapp's angular.json turns off inlined critical CSS); network calls
  # only to the API, Cognito and this stage's upload bucket; images from the storage CDN; Google
  # Fonts; no frames, no plugins, never framed. Styles allow 'unsafe-inline' because Angular adds
  # component styles as <style> tags at runtime. Tested in Chrome against the prod build
  # 2026-11-16 (sign-in, storefront with images, checkout: no violations).
  WebappSecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ceseelia-webapp-security-${StageName}
        Comment: Ceseelia webapp security headers with CSP (S.14)
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub
              - >-
                default-src 'self';
                script-src 'self';
                style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                font-src 'self' data: https://fonts.gstatic.com;
                img-src 'self' data: blob: https://${StageName}.storage.${DomainName};
                connect-src 'self' https://${ApiHost} https://cognito-idp.${AWS::Region}.amazonaws.com
                https://ceseelia-storage-${StageName}.s3.${AWS::Region}.amazonaws.com
                https://ceseelia-storage-${StageName}.s3.amazonaws.com;
                worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none';
                base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests
              - ApiHost: !If [ IsProductionEnvironment, !Sub "api.${DomainName}", !Sub "dev.api.${DomainName}" ]
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true

  WebappDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub Ceseelia webapp (${StageName})
        Enabled: true
        Aliases:
          - !If [ IsProductionEnvironment, !Sub "app.${DomainName}", !Sub "dev.${DomainName}" ]
          # Every store's own address (9.8 phase 1); names with their own record (api, dev,
          # *.storage, mail) are untouched, since DNS and CloudFront prefer the exact name.
          - !If [ IsProductionEnvironment, !Sub "*.${DomainName}", !Ref AWS::NoValue ]
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        PriceClass: PriceClass_200
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: webapp
            DomainName: !GetAtt WebappBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebappOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          # Only reached through WebappRouterFunction (link previews).
          - Id: api
            DomainName: !If [ IsProductionEnvironment, !Sub "api.${DomainName}", !Sub "dev.api.${DomainName}" ]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [ TLSv1.2 ]
              HTTPSPort: 443
        DefaultCacheBehavior:
          TargetOriginId: webapp
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [ GET, HEAD ]
          CachedMethods: [ GET, HEAD ]
          Compress: true
          # Managed CachingOptimized: follows the files' Cache-Control (index.html no-cache,
          # hashed bundles a year; see the webapp's deploy script) and the preview's 5 minutes.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # HSTS, nosniff, never framed, referrer policy, XSS protection and the CSP (S.14).
          ResponseHeadersPolicyId: !Ref WebappSecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WebappRouterFunction.FunctionMetadata.FunctionARN
        # A missing file (S3 answers 403 without ListBucket) is a plain 404, not cached long.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  WebappDnsA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !If [ IsProductionEnvironment, !Sub "app.${DomainName}.", !Sub "dev.${DomainName}." ]
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebappDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # every CloudFront distribution
  WebappDnsAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !If [ IsProductionEnvironment, !Sub "app.${DomainName}.", !Sub "dev.${DomainName}." ]
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt WebappDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
  # Store subdomains (prod, 9.8 phase 1): <slug>.<DomainName> → the webapp. Existing names keep
  # their own records; the webapp sends a name that can't be a store (admin., www.) to the app.
  WebappStoresDnsA:
    Type: AWS::Route53::RecordSet
    Condition: IsProductionEnvironment
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "*.${DomainName}."
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebappDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
  WebappStoresDnsAAAA:
    Type: AWS::Route53::RecordSet
    Condition: IsProductionEnvironment
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "*.${DomainName}."
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt WebappDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  ######################################
  # Custom domains (backend 9.8 phase 2, prod only)
  ######################################
  # A store can use its own subdomain (shop.theirbrand.com). The merchant adds one CNAME,
  # shop.theirbrand.com → domains.<DomainName>; the API (CeseeliaServerRole, policy below) then
  # creates a distribution tenant for that name on CustomDomainDistribution, with a certificate
  # CloudFront requests and renews itself (HTTP validation). This is a separate multi-tenant
  # distribution, so app.<DomainName> and *.<DomainName> (WebappDistribution) are untouched.
  # Same bucket, origins, caching and headers as the webapp; the router below differs only in
  # how link-preview bots are recognised (by host, not by /s/<slug>).
  CustomDomainConnectionGroup:
    Type: AWS::CloudFront::ConnectionGroup
    Condition: IsProductionEnvironment
    Properties:
      Name: !Sub ceseelia-custom-domains-${StageName}
      Enabled: true
      Ipv6Enabled: true

  # Viewer request: like WebappRouterFunction, but every host here is a store's own domain:
  #   - a link-preview bot asking for `/` [?item=<id>] gets the API's preview for that host
  #     (/api/v1/store/public/preview-domain/<host>[/<id>]; the API maps host → store);
  #   - /api/... is refused; other paths without an extension are app routes (/index.html).
  CustomDomainRouterFunction:
    Type: AWS::CloudFront::Function
    Condition: IsProductionEnvironment
    Properties:
      Name: !Sub ceseelia-custom-domain-router-${StageName}
      AutoPublish: true
      FunctionConfig:
        Comment: Stores' own domains - SPA routes to index.html; bots to the API's preview page
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        import cf from 'cloudfront';

        var HOST = /^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$/;
        var BOTS = /facebookexternalhit|facebot|twitterbot|whatsapp|linkedinbot|slackbot|telegrambot|discordbot|pinterest|skypeuripreview|redditbot|applebot|googlebot|bingbot|embedly|mastodon|vkshare|tumblr/i;
        var ULID = /^[0-9A-HJKMNP-TV-Z]{26}$/;

        function handler(event) {
          var req = event.request;
          var uri = req.uri;
          var ua = req.headers['user-agent'] ? req.headers['user-agent'].value : '';
          var host = req.headers.host ? req.headers.host.value.toLowerCase() : '';
          if ((uri === '/' || uri === '') && HOST.test(host) && host.length <= 253 && BOTS.test(ua)) {
            var item = req.querystring.item ? req.querystring.item.value : '';
            req.uri = '/api/v1/store/public/preview-domain/' + host + (ULID.test(item) ? '/' + item : '');
            req.querystring = {};
            cf.selectRequestOriginById('api');
            return req;
          }
          if (uri === '/api' || uri.indexOf('/api/') === 0) {
            return { statusCode: 404, statusDescription: 'Not Found' };
          }
          var last = uri.substring(uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') === -1) {
            req.uri = '/index.html';
          }
          return req;
        }

  # Multi-tenant ("tenant-only"): no aliases and no price class here (tenants carry the domains;
  # IPv6 is the connection group's). The *.<DomainName> certificate is only the inherited default:
  # each tenant gets its own CloudFront-managed certificate for its domain.
  CustomDomainDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: IsProductionEnvironment
    Properties:
      DistributionConfig:
        Comment: !Sub Ceseelia stores' own domains (${StageName})
        Enabled: true
        ConnectionMode: tenant-only
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Origins:
          - Id: webapp
            DomainName: !GetAtt WebappBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebappOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub "api.${DomainName}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [ TLSv1.2 ]
              HTTPSPort: 443
        DefaultCacheBehavior:
          TargetOriginId: webapp
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [ GET, HEAD ]
          CachedMethods: [ GET, HEAD ]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # managed CachingOptimized
          ResponseHeadersPolicyId: !Ref WebappSecurityHeadersPolicy # same headers and CSP as the webapp
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CustomDomainRouterFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  # What merchants point their CNAME at. A plain CNAME (not an alias): CloudFront follows the
  # CNAME chain shop.theirbrand.com → domains.<DomainName> → the routing endpoint to accept the
  # domain and validate its certificate. The TXT record is CloudFront's documented fallback
  # proof for a SaaS-owned name in the chain (`_cf-challenge.<name>` = routing endpoint).
  CustomDomainTargetDns:
    Type: AWS::Route53::RecordSet
    Condition: IsProductionEnvironment
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "domains.${DomainName}."
      Type: CNAME
      TTL: "300"
      ResourceRecords:
        - !GetAtt CustomDomainConnectionGroup.RoutingEndpoint
  CustomDomainChallengeDns:
    Type: AWS::Route53::RecordSet
    Condition: IsProductionEnvironment
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "_cf-challenge.domains.${DomainName}."
      Type: TXT
      TTL: "300"
      ResourceRecords:
        - !Sub
          - '"${Endpoint}"'
          - Endpoint: !GetAtt CustomDomainConnectionGroup.RoutingEndpoint

  # The API server (CeseeliaServerRole, made by hand) manages tenants on this distribution only.
  # CloudFront asks ACM for each tenant's certificate in the caller's name, hence the ACM actions;
  # DeleteCertificate cleans up after a domain is removed. No ManagedPolicyName: a fixed name
  # needs CAPABILITY_NAMED_IAM, and CI deploys with CAPABILITY_IAM only (CloudFormation names it).
  CustomDomainServerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: IsProductionEnvironment
    Properties:
      Description: Ceseelia API - stores' own domains (CloudFront distribution tenants)
      Roles: [ CeseeliaServerRole ]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Tenants
            Effect: Allow
            Action:
              - cloudfront:CreateDistributionTenant
              - cloudfront:GetDistributionTenant
              - cloudfront:GetDistributionTenantByDomain
              - cloudfront:UpdateDistributionTenant
              - cloudfront:DeleteDistributionTenant
              - cloudfront:GetManagedCertificateDetails
              - cloudfront:VerifyDnsConfiguration
              - cloudfront:TagResource
            Resource:
              - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CustomDomainDistribution}
              - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution-tenant/*
              - !GetAtt CustomDomainConnectionGroup.Arn
          - Sid: TenantCertificates
            Effect: Allow
            Action:
              - acm:RequestCertificate
              - acm:DescribeCertificate
              - acm:DeleteCertificate
              - acm:AddTagsToCertificate
            Resource: '*'

  ######################################
  # Lambda - Cognito Triggers
  ######################################
  ### OnUserRegister ###
  OnUserRegister:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub OnUserRegister-ceseelia-${StageName}-${ApiVersion}
      CodeUri: ./lambda/triggers/cognito/on-user-register
      Handler: app.lambdaHandler
      # 9.5 least privilege: this stage's table and its indexes only (was AmazonDynamoDBFullAccess).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DatabaseTable
      Events:
        ExplicitApi:
          Type: Cognito
          Properties:
            UserPool: !Ref CognitoUserPool
            Trigger: PostConfirmation

  ######################################
  # 9.6 Logs & alarms
  ######################################
  ### The API's logs (Docker's awslogs driver on the server; JSON lines from pino) ###
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ceseelia/${StageName}/api
      RetentionInDays: 30

  ### Every error-level line (pino level 50 = error, 60 = fatal) counts once ###
  ApiErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiLogGroup
      FilterPattern: "{ $.level >= 50 }"
      MetricTransformations:
        - MetricNamespace: !Sub Ceseelia/${StageName}
          MetricName: ApiErrors
          MetricValue: "1"
          DefaultValue: 0

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ceseelia-alarms-${StageName}

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ceseelia-${StageName}-api-errors
      AlarmDescription: The API logged 5 or more errors in 5 minutes. Search the log group for level 50.
      Namespace: !Sub Ceseelia/${StageName}
      MetricName: ApiErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlarmTopic ]
      OKActions: [ !Ref AlarmTopic ]

  DynamoThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ceseelia-${StageName}-dynamodb-throttles
      AlarmDescription: DynamoDB throttled requests on the table (on-demand should rarely throttle).
      Metrics:
        - Id: total
          Expression: "reads + writes"
          Label: Throttle events
        - Id: reads
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: ReadThrottleEvents
              Dimensions: [ { Name: TableName, Value: !Ref DatabaseTable } ]
            Period: 300
            Stat: Sum
        - Id: writes
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: WriteThrottleEvents
              Dimensions: [ { Name: TableName, Value: !Ref DatabaseTable } ]
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlarmTopic ]

  DynamoSystemErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ceseelia-${StageName}-dynamodb-system-errors
      AlarmDescription: DynamoDB returned server errors (500s) for the table.
      Namespace: AWS/DynamoDB
      MetricName: SystemErrors
      Dimensions: [ { Name: TableName, Value: !Ref DatabaseTable } ]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlarmTopic ]

  OnUserRegisterErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ceseelia-${StageName}-sign-up-trigger-errors
      AlarmDescription: The Cognito sign-up trigger failed (new users' rows are then made by get-my-profile).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [ { Name: FunctionName, Value: !Ref OnUserRegister } ]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlarmTopic ]

  # SES reputation is per account and region, so only the prod stack watches it. AWS reviews an
  # account at a 5% bounce rate or a 0.1% complaint rate; these warn well before that.
  SesBounceRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProductionEnvironment
    Properties:
      AlarmName: ceseelia-ses-bounce-rate
      AlarmDescription: SES bounce rate is over 3% (AWS reviews the account at 5%).
      Namespace: AWS/SES
      MetricName: Reputation.BounceRate
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.03
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlarmTopic ]

  SesComplaintRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProductionEnvironment
    Properties:
      AlarmName: ceseelia-ses-complaint-rate
      AlarmDescription: SES complaint rate is over 0.05% (AWS reviews the account at 0.1%).
      Namespace: AWS/SES
      MetricName: Reputation.ComplaintRate
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.0005
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [ !Ref AlarmTopic ]

Outputs:
  WebappBucketName:
    Description: Where the webapp's build is uploaded (see the webapp's deploy script)
    Value: !Ref WebappBucket
  WebappDistributionId:
    Description: The webapp distribution, for cache invalidations after a deploy
    Value: !Ref WebappDistribution
  WebappUrl:
    Description: The webapp's address
    Value: !If [ IsProductionEnvironment, !Sub "https://app.${DomainName}", !Sub "https://dev.${DomainName}" ]
  CustomDomainDistributionId:
    Condition: IsProductionEnvironment
    Description: Stores' own domains - the API's CUSTOM_DOMAIN_DISTRIBUTION_ID
    Value: !Ref CustomDomainDistribution
  CustomDomainConnectionGroupId:
    Condition: IsProductionEnvironment
    Description: Stores' own domains - the API's CUSTOM_DOMAIN_CONNECTION_GROUP_ID
    Value: !GetAtt CustomDomainConnectionGroup.Id
  CustomDomainRoutingEndpoint:
    Condition: IsProductionEnvironment
    Description: Where domains.<DomainName> points
    Value: !GetAtt CustomDomainConnectionGroup.RoutingEndpoint
  ApiLogGroupName:
    Description: The log group the API server's Docker awslogs driver writes to
    Value: !Ref ApiLogGroup
  AlarmTopicArn:
    Description: SNS topic for alarms (subscribe an email or phone to it)
    Value: !Ref AlarmTopic
