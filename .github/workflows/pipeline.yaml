          
name: Pipeline

on:
  push:
    branches:
      - 'dev_v1.0.0'
      - 'prod_v1.0.0'

env:
  API_VERSION: v1
  PIPELINE_USER_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  PIPELINE_USER_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  SAM_TEMPLATE: template.yaml
  # 9.6: where alarms are emailed; a repository variable (Settings > Secrets and variables >
  # Actions > Variables), so no address is in git. Unset = no email subscription.
  ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
  REGION: us-east-1
  
  STAGE_DEV: dev
  DEV_STACK_NAME: ceseelia-dev
  DEV_ARTIFACTS_BUCKET: ceseelia-sam-artifacts

  STAGE_PROD: prod
  PROD_STACK_NAME: ceseelia-prod
  PROD_ARTIFACTS_BUCKET: ceseelia-sam-artifacts

jobs:
  # 9.5: the template must lint clean (errors; warnings are allowed) before anything deploys.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install cfn-lint==1.60.1
      - run: cfn-lint --non-zero-exit-code error ${SAM_TEMPLATE}

  deploy-dev:
    if: github.ref == 'refs/heads/dev_v1.0.0'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: aws-actions/setup-sam@v2
        with:
          version: 1.140.0
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ env.PIPELINE_USER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.PIPELINE_USER_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}
      - name: install npm & google layers
        run: cd ./lambda/layers/npm/nodejs/ && 
             rm -rf node_modules/  && 
             npm install && 
             cd ../../../../
      - name: Deploy to dev account
        run: |
          sam deploy --stack-name ${DEV_STACK_NAME} \
            --template ${SAM_TEMPLATE} \
            --parameter-overrides StageName=${STAGE_DEV} ApiVersion=${API_VERSION} ${ALARM_EMAIL:+AlarmEmail=$ALARM_EMAIL} \
            --capabilities CAPABILITY_IAM \
            --region ${REGION} \
            --s3-bucket ${DEV_ARTIFACTS_BUCKET} \
            --no-fail-on-empty-changeset \
            --no-confirm-changeset

  deploy-prod:
    if: github.ref == 'refs/heads/prod_v1.0.0'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: aws-actions/setup-sam@v2
        with:
          version: 1.140.0
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ env.PIPELINE_USER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.PIPELINE_USER_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}
      - name: install npm & google layers
        run: cd ./lambda/layers/npm/nodejs/ && 
             rm -rf node_modules/  && 
             npm install && 
             cd ../../../../
      - name: Deploy to prod account
        run: |
          sam deploy --stack-name ${PROD_STACK_NAME} \
            --template ${SAM_TEMPLATE} \
            --parameter-overrides StageName=${STAGE_PROD} ApiVersion=${API_VERSION} ${ALARM_EMAIL:+AlarmEmail=$ALARM_EMAIL} \
            --capabilities CAPABILITY_IAM \
            --region ${REGION} \
            --s3-bucket ${PROD_ARTIFACTS_BUCKET} \
            --no-fail-on-empty-changeset \
            --no-confirm-changeset
